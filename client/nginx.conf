# Log level computed from the HTTP status, same rule as the back-end:
# 5xx = error, 4xx = warn, other = info
map $status $log_level {
    ~^5     error;
    ~^4     warn;
    default info;
}

# Access logs in JSON, with the same field names as the back-end logs
# $uri = path without the query string (avoids logging personal data)
log_format orion_json escape=json
    '{"message":"$request_method $uri $status","level":"$log_level",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent}';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log orion_json;

    # React routes: always serve index.html
    location / {
        try_files $uri /index.html;
    }

    # API calls: forward to the back-end container
    location /api/ {
        proxy_pass http://server:8080;
    }
}

# Based on the GitHub "Node.js CI" template, adapted to build and test client and server separately,
# then publish their Docker images to ghcr.io on push to main
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # each Monday at 6 a.m. UTC

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json # package-lock.json is not at the repository root
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --run

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json # package-lock.json is not at the repository root
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed by SonarQube to detect new code
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ldvgn
            -Dsonar.projectKey=ldvgn_oc-DFSJS-Mettez-en-uvre-l-int-gration-et-le-d-ploiement-continu-d-une-application-full-stack-JS
            -Dsonar.sources=client/src,server/src
            -Dsonar.tests=client/src,server/src
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.qualitygate.wait=true

  publish:
    needs: [server, client, sonar] # only if build, tests and SonarQube passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # only on push to main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push images to ghcr.io

    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/ldvgn/orion-server:latest
            ghcr.io/ldvgn/orion-server:${{ github.sha }}
      - name: Build and push client image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/ldvgn/orion-client:latest
            ghcr.io/ldvgn/orion-client:${{ github.sha }}

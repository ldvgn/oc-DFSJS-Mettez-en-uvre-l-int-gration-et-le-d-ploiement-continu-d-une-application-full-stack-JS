# Based on the GitHub "Node.js CI" template, adapted to build and test client and server separately
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # each Monday at 6 a.m. UTC

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json # package-lock.json is not at the repository root
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --run

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json # package-lock.json is not at the repository root
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

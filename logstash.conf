input {
  # Back-end logs, sent by Winston
  http {
    port => 5044
    codec => json
  }

  # Front-end logs, written by Nginx in ./logs/nginx (one JSON line per request, level included)
  file {
    path => "/var/log/nginx/access.log"
    codec => json
    add_field => { "service" => "orion-client" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-logs-%{+YYYY.MM.dd}"
  }
}
